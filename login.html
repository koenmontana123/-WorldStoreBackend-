<!DOCTYPE html>
<html>
<head>
    <title>WorldStore - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        h1 { color: #333; margin-bottom: 30px; text-align: center; }
        .role-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .role-btn { flex: 1; padding: 12px; border: 2px solid #ddd; background: white; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.3s; }
        .role-btn.active { background: #667eea; color: white; border-color: #667eea; }
        .role-btn:hover { border-color: #667eea; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        button:hover { background: #764ba2; }
        .link { text-align: center; margin-top: 20px; }
        .link a { color: #667eea; text-decoration: none; cursor: pointer; }
        .link a:hover { text-decoration: underline; }
        .error { color: red; font-size: 14px; margin-bottom: 15px; }
        .success { color: green; font-size: 14px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WorldStore Login</h1>
        <div class="role-selector">
            <button class="role-btn active" onclick="setRole('buyer')">👤 Buyer</button>
            <button class="role-btn" onclick="setRole('seller')">🏪 Seller</button>
        </div>
        <div id="message"></div>
        <input type="email" id="email" placeholder="Email address" />
        <input type="password" id="password" placeholder="Password" />
        <button onclick="login()">Login</button>
        <div class="link">
            Don't have an account? <a onclick="goToSignup()">Sign Up</a>
        </div>
    </div>

    <script>
        let selectedRole = 'buyer';

        function setRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showMessage('Please enter email and password', 'error');
                return;
            }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && data.user.role === selectedRole) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.user.role);
                    localStorage.setItem('userId', data.user.id);
                    localStorage.setItem('userName', data.user.fullName);
                    
                    if (selectedRole === 'buyer') {
                        window.location.href = 'buyer-portal.html';
                    } else {
                        window.location.href = 'seller-portal.html';
                    }
                } else {
                    showMessage(data.error || 'Login failed or role mismatch', 'error');
                }
            } catch (err) {
                showMessage('Error: ' + err.message, 'error');
            }
        }

        function showMessage(msg, type) {
            const msgEl = document.getElementById('message');
            msgEl.innerHTML = `<div class="${type}">${msg}</div>`;
            setTimeout(() => msgEl.innerHTML = '', 3000);
        }

        function goToSignup() {
            window.location.href = 'signup.html';
        }

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
